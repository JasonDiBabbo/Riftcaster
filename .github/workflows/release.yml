# Builds a downloadable Windows release (issue #60): a self-contained zip that runs without .NET
# installed. Pushing a version tag, such as v0.2.0, attaches it to a new GitHub Release; running the
# workflow by hand (Actions > Release > Run workflow) only builds it, as an artifact to try.
#
# A tag's build is signed with Azure Artifact Signing (#61), so Windows names the publisher and Smart
# App Control lets it run. Signing runs in the release environment, which only v* tags may use; it
# holds the IDs azure/login needs and Azure trusts its OIDC token, so no secret is stored. A manual
# run stays unsigned.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release at a time; a newer tag waits rather than cancelling one half-published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # Only a tag's run enters the release environment: its rules turn away anything else, so a manual
    # run would fail before its first step.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    permissions:
      contents: write # Creating the release and uploading the zip
      id-token: write # The OIDC token azure/login trades for access to the signing account
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/overlays/package-lock.json

      # v0.2.0 releases 0.2.0. A manual run, with no tag, builds the version in Directory.Build.props.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '' }
          "version=$version" >> $env:GITHUB_OUTPUT

      # As CI does: never release a build whose tests fail.
      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Self-contained: the .NET runtime goes in the folder, with a real Riftcaster.Server.exe to start
      # it. UseAppHost is off for development (Directory.Build.props, because Smart App Control blocks
      # an unsigned .exe built on each rebuild), so it's switched on here.
      # @(...) keeps the arguments a list: PowerShell unwraps a one-item array returned from an if
      # into a plain string, and splatting a string (@versionArgs) passes it one character at a time.
      - name: Publish
        shell: pwsh
        run: |
          $versionArgs = @(if ('${{ steps.version.outputs.version }}') { '-p:Version=${{ steps.version.outputs.version }}' })
          dotnet publish src/Riftcaster.Server --configuration Release --runtime win-x64 --self-contained -p:UseAppHost=true @versionArgs --output publish

      - name: Sign in to Azure
        if: github.ref_type == 'tag'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only Riftcaster's own files: the rest of the folder is the .NET runtime and libraries, which
      # their publishers already signed, and each signature counts against the account's monthly quota.
      - name: Sign
        if: github.ref_type == 'tag'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: riftcastersigning
          certificate-profile-name: riftcasterpublic
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: Riftcaster*.dll,Riftcaster*.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Without a timestamp a signature dies with its three-day certificate, so check each file is
      # signed, trusted and timestamped before anything is published.
      - name: Check the signatures
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File | Where-Object { $_.Name -like 'Riftcaster*' -and $_.Extension -in '.dll', '.exe' }
          if (-not $files) { throw 'No Riftcaster files to check in publish.' }
          $failed = $false
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $timestamped = $null -ne $signature.TimeStamperCertificate
            "$($file.Name): $($signature.Status), signed by $($signature.SignerCertificate.Subject), timestamped: $timestamped"
            if ($signature.Status -ne 'Valid' -or -not $timestamped) { $failed = $true }
          }
          if ($failed) { throw 'A Riftcaster file is unsigned, untrusted or has no timestamp.' }

      # After signing, so the files checked are the ones published.
      - name: Check the published server
        shell: pwsh
        run: |
          $versionArgs = @(if ('${{ steps.version.outputs.version }}') { '--version'; '${{ steps.version.outputs.version }}' })
          node tools/publish/check-publish.mjs publish @versionArgs

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if (-not $version) { $version = (Get-Date -Format 'yyyyMMdd') + '-' + $env:GITHUB_SHA.Substring(0, 7) }
          $zip = "Riftcaster-$version-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload the zip (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.zip }}
          archive: false # Our zip as it is: GitHub would otherwise zip it again

      # A version with a suffix, such as v0.2.0-beta.1, is marked as a pre-release.
      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prerelease = @(if ('${{ github.ref_name }}' -match '-') { '--prerelease' })
          gh release create '${{ github.ref_name }}' '${{ steps.zip.outputs.zip }}' --title 'Riftcaster ${{ steps.version.outputs.version }}' --generate-notes @prerelease
