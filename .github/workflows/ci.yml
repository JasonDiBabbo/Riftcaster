# Builds and tests the whole solution on every push to main and every pull request. `dotnet build`
# also regenerates the TypeScript contracts and typechecks, lints, format-checks and bundles the
# overlays (see the BuildOverlays target in src/Riftcaster.Server/Riftcaster.Server.csproj), so these
# two steps cover everything a developer's local build does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Riftcaster uses American spelling everywhere (#86); the settings are in _typos.toml. Its own job
  # on Linux, because the typos action downloads with wget, which Windows runners lack.
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: crate-ci/typos@v1.51.1

  build-and-test:
    # Windows, matching the platform Riftcaster runs on (the OBS machine).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/overlays/package-lock.json

      - name: Build
        run: dotnet build --configuration Release

      # Also records line coverage (coverlet), one report per test project, for the coverage step. The
      # GitHubActions logger puts the results on the run's summary page and flags failing tests in the
      # pull request's changed files (#81).
      - name: Test .NET
        run: dotnet test --configuration Release --no-build --logger GitHubActions --collect:"XPlat Code Coverage" --results-directory TestResults

      # dotnet test doesn't pick up the overlays' Vitest tests, so they get their own step.
      - name: Test overlays
        run: npm test
        working-directory: src/overlays

      # Each C# file's coverage against its minimum in tools/coverage/minimums.mjs.
      - name: Check coverage
        run: node tools/coverage/check-coverage.mjs TestResults

      # A published build works on its own: run as Production from another folder, it serves the
      # web interface and every overlay (#48). Uses the Release build above.
      - name: Publish
        run: dotnet publish src/Riftcaster.Server --configuration Release --no-build --output publish

      - name: Check the published server
        run: node tools/publish/check-publish.mjs publish
